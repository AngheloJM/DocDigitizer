services:
  postgres:
    image: postgres:16
    container_name: docdigitizer-postgres-metadatos-y-rutas
    environment:
      POSTGRES_DB: docdigitizer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: docdigitizer-redis-cola-tareas
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: docdigitizer-minio-archivos-pdf-imagenes
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-changeme}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-changeme}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  worker-ocr-pdf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docdigitizer-celery-worker-ocr-pdf
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/docdigitizer
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
    depends_on:
      - postgres
      - redis
      - minio

volumes:
  postgres_data:
  minio_data:
